# Builds the results dashboard from the committed data and deploys it to GitHub Pages.
# Pull requests: test + build only (the page is kept as a downloadable artifact).
# Pushes to main: test + build + deploy. Needs Settings → Pages → Source: "GitHub Actions".
name: Dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4   # tests/test_dashboard.py checks metrics.js against the Python scores
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build dashboard
        run: |
          python -m dashboard.build --out _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
